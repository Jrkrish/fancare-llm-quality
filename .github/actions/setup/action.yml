name: Set up FanCare test environment
description: Python with cached pip packages and model files, optionally the Playwright browser.
inputs:
  playwright:
    description: Install Chromium for Playwright
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Cache embedding / reranker / OCR models
      uses: actions/cache@v4
      with:
        path: .cache/models
        key: models-bge-small-en-v1.5-ms-marco-MiniLM-L-6-v2
    - name: Install dependencies
      shell: bash
      run: pip install -r requirements-dev.txt
    - name: Cache Playwright browser
      if: inputs.playwright == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-1.64.1-chromium
    - name: Install Chromium
      if: inputs.playwright == 'true'
      shell: bash
      run: python -m playwright install --with-deps chromium
