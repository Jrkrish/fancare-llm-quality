name: Daily measurement run

# Fills the README results on Groq's free tier: one item from campaign/manifest.json per day.
# The hourly schedule only asks "is an item due?"; tools/campaign.py enforces the start time and the
# 24-hour gap. Scheduled runs do nothing unless the repository variable MEASUREMENT_ENABLED is "true".
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show which item would run (uses no Groq quota)
        type: boolean
        default: true

concurrency:
  group: measurement
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # to see which batches already have an artifact

env:
  PYTHONUTF8: "1"

jobs:
  pick:
    if: github.event_name == 'workflow_dispatch' || vars.MEASUREMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.next.outputs.due }}
      item: ${{ steps.next.outputs.item }}
      kind: ${{ steps.next.outputs.kind }}
      command: ${{ steps.next.outputs.command }}
      artifact: ${{ steps.next.outputs.artifact }}
      code_commit: ${{ steps.next.outputs.code_commit }}
    steps:
      - uses: actions/checkout@v4
      - name: List earlier batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100"
          --jq '.artifacts[] | {name, created_at} | tojson' > artifacts.jsonl
      - name: Pick the due item
        id: next
        run: python3 -m tools.campaign next --artifacts artifacts.jsonl

  measure:
    needs: pick
    if: needs.pick.outputs.due == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Shared with the nightly drift job so the two never compete for the per-minute token limit.
    concurrency:
      group: groq-quota
      cancel-in-progress: false
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_MIN_INTERVAL_S: "2.0"
      LLM_MAX_RETRIES: "5"
    steps:
      - uses: actions/checkout@v4 # tooling and manifest, from this branch
      - uses: actions/checkout@v4 # the bot and eval code being measured, pinned
        with:
          ref: ${{ needs.pick.outputs.code_commit }}
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements*.txt
      - uses: actions/cache@v4
        with:
          path: code/.cache/models
          key: models-bge-small-en-v1.5-ms-marco-MiniLM-L-6-v2
      - name: Install dependencies
        working-directory: code
        run: pip install -r requirements-dev.txt
      - name: Check the LLM API key is configured
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error title=Missing secret::GROQ_API_KEY is not set."
            exit 1
          fi
      - name: Run ${{ needs.pick.outputs.item }}
        if: needs.pick.outputs.kind != 'load'
        working-directory: code
        env:
          ITEM_COMMAND: ${{ needs.pick.outputs.command }}
        # A non-zero exit also means "a quality gate failed", which is a result.
        # The next step decides whether the run measured enough to keep.
        run: python $ITEM_COMMAND || echo "::notice::exited with status $?"
      - name: Run the load test
        if: needs.pick.outputs.kind == 'load'
        working-directory: code
        run: |
          mkdir -p reports/load
          nohup uvicorn app.main:app --port 8000 > app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8000/health && break; sleep 2; done
          START=$(date -u +%Y-%m-%dT%H:%M:%S)
          locust -f tests/load/locustfile.py --host http://localhost:8000 --headless -u 2 -r 1 -t 3m \
            --csv reports/load/run --html reports/load/report.html || echo "::notice::locust exited with status $?"
          python -m tests.load.summarize reports/load/run_stats.csv --since "$START"
      - name: Check the run measured enough
        id: check
        if: always()
        run: python3 -m tools.campaign check --item "${{ needs.pick.outputs.item }}" --code-dir code
      - name: Show the report
        if: always()
        run: |
          { echo '```json'; cat code/reports/batch.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          for f in code/reports/eval/latest/summary.md code/reports/{safety,tool_use,conversation,load}/summary.md; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" || true
          done
      # Always upload, so a failed attempt also starts the 24-hour wait instead of retrying at once.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Written this way round because '' counts as false: `valid && '' || '--invalid'` always adds the suffix.
          name: ${{ needs.pick.outputs.artifact }}${{ steps.check.outputs.valid != 'true' && '--invalid' || '' }}
          path: code/reports/
          retention-days: 90
      - name: Flag a run that has to be repeated
        if: always() && steps.check.outputs.valid != 'true'
        run: |
          echo "::error::This run is incomplete and does not count. See the check step for the reason."
          exit 1
